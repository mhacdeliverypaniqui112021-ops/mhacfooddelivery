<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>MHAC ADMIN</title><style>body{font-family:Arial;padding:18px;max-width:700px;margin:auto}input,select{width:100%;padding:11px;margin:5px 0}button{padding:10px;margin:4px;border:0;border-radius:8px}.red{background:#e21d25;color:#fff}.card{border:2px solid #ddd;border-radius:15px;padding:16px;margin:12px 0}</style></head><body><h1>MHAC DELIVERY ADMIN</h1><p>Add food, price and choices. Format choices: No Drink:0,Coke Regular:25,Coke Medium:35,Coke Large:45</p><div class=card><select id=s></select><input id=c placeholder="Category"><input id=n placeholder="Food name"><input id=p type=number placeholder="Price"><input id=x placeholder="Choices"><button class=red onclick=add()>ADD FOOD</button></div><div id=list></div><script>
let d=JSON.parse(localStorage.mhacMenuV13||"null");if(!d){alert("Open customer app first.");}function fill(){s.innerHTML=d.stores.map((a,i)=>`<option value=${i}>${a.name}</option>`).join("");show()}function add(){let st=d.stores[s.value],cn=c.value.trim(),f={name:n.value.trim(),price:+p.value,choices:x.value.split(",").filter(Boolean).map(v=>{let a=v.split(":");return[a[0],+(a[1]||0)]})};let cat=st.cats.find(a=>a.name.toLowerCase()==cn.toLowerCase());if(!cat){cat={name:cn,foods:[]};st.cats.push(cat)}cat.foods.push(f);localStorage.mhacMenuV13=JSON.stringify(d);show()}function show(){list.innerHTML=d.stores.map(a=>`<div class=card><h2>${a.icon} ${a.name}</h2>${a.cats.map(c=>`<b>${c.name}</b>${c.foods.map(f=>`<p>${f.name} — ₱${f.price}<br>${f.choices.map(q=>q[0]+" +₱"+q[1]).join(" • ")}</p>`).join("")}`).join("")}</div>`).join("")}fill()</script></body></html>
