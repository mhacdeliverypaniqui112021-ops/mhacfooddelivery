<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHAC ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#111}
header{background:#111;color:#fff;padding:16px;text-align:center;border-bottom:4px solid #e21d25}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;font-size:12px}
main{max-width:980px;margin:auto;padding:12px}
.card{background:#fff;border:2px solid #ddd;border-radius:15px;padding:14px;margin:12px 0}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}
.red{background:#e21d25;color:#fff}.green{background:#138a36;color:#fff}.dark{background:#111;color:#fff}.gray{background:#ddd}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border:1.5px solid #ddd;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.small{font-size:12px;color:#666}
.order{border:2px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}
.order.new{border-color:#e21d25}
.order-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eee;font-size:11px;font-weight:900}
.badge.NEW{background:#ffd9d9}.badge.ACCEPTED{background:#dcecff}.badge.PREPARING{background:#fff0c2}
.badge.READY{background:#dff5df}.badge.PICKED-UP{background:#e7dcff}.badge.DELIVERED{background:#cdebd4}.badge.CANCELLED{background:#ddd}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section{background:#fafafa;border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:10px}
.order-items{line-height:1.55}
.total{font-size:20px;font-weight:900}
select,input{width:100%;padding:9px;border:1px solid #aaa;border-radius:8px}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>MHAC DELIVERY — ADMIN APP</h1>
<p>ORDER MANAGEMENT • CUSTOMER • RIDER • STATUS</p>
</header>
<main>
<div class="card">
  <div class="toolbar">
    <button class="dark" onclick="refreshOrders()">🔄 REFRESH</button>
    <button class="red" onclick="clearOrders()">CLEAR ALL ORDERS</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><b id="newCount">0</b><span>NEW</span></div>
  <div class="stat"><b id="activeCount">0</b><span>ACTIVE</span></div>
  <div class="stat"><b id="doneCount">0</b><span>DELIVERED</span></div>
  <div class="stat"><b id="allCount">0</b><span>TOTAL</span></div>
</div>

<div class="card">
<h2 style="margin-top:0">📥 INCOMING ORDERS</h2>
<div id="orders">No orders yet.</div>
</div>
</main>
<script src="admin.js"></script>
</body>
</html>
