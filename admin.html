<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MHAC DELIVERY — ADMIN CLEAN</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="appFrame" src="https://mhacdeliverypaniqui112021-ops.github.io/mhacfooddelivery/admin.html" title="MHAC DELIVERY ADMIN APP"></iframe>
<script>
(function(){
  const frame=document.getElementById("appFrame");
  const BAD=["V4.1.57","V4.1.49","TIME LIMIT TEST MODE","MASTER UNIFIED WHITE UI","LIVE RIDER SYNC","ADMIN MASTER","CUSTOMER MASTER","RIDER MASTER"];
  function cleanFrame(){
    try{
      const d=frame.contentDocument;
      if(!d) return;
      d.querySelectorAll("body *").forEach(el=>{
        const id=String(el.id||"").toLowerCase();
        const txt=String(el.textContent||"").trim().toUpperCase();
        if(id==="badge" || BAD.some(x=>txt.includes(x))){
          if(el!==d.body && el!==d.documentElement) el.remove();
        }
      });
    }catch(e){}
  }
  frame.addEventListener("load",()=>{
    cleanFrame();
    try{
      new MutationObserver(cleanFrame).observe(frame.contentDocument.documentElement,{subtree:true,childList:true});
    }catch(e){}
  });
})();
</script>
</body>
</html>
