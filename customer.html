<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHAC DELIVERY — CUSTOMER V4.1.57</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}
.partGrid{display:block!important;margin-top:7px!important}
.partBox{
  width:100%!important;min-height:52px!important;margin:5px 0!important;padding:7px 10px!important;
  display:grid!important;grid-template-columns:minmax(0,1fr) 40px 34px 40px!important;
  align-items:center!important;gap:6px!important;border:1px solid #222!important;border-radius:9px!important;
  background:#fff!important;color:#111!important;font-size:16px!important;font-weight:900!important;
}
.partName{min-width:0!important;text-align:left!important;line-height:1.15!important;overflow-wrap:anywhere!important}
.partBox .partMinus,.partBox .partPlus{
  width:40px!important;min-width:40px!important;height:40px!important;min-height:40px!important;
  margin:0!important;padding:0!important;display:flex!important;align-items:center!important;
  justify-content:center!important;border:1px solid #222!important;border-radius:8px!important;
  background:#fff!important;color:#111!important;font-size:22px!important;font-weight:900!important;line-height:1!important;
}
.partBox .partQty{width:34px!important;min-width:34px!important;text-align:center!important;font-size:18px!important;font-weight:900!important;line-height:1!important}
.partBox.selected{background:#f7f7f7!important;border-color:#111!important}
.partTotal{width:100%!important;margin-top:8px!important;padding:8px!important;text-align:center!important;border-radius:9px!important;background:#f2f2f2!important;font-size:14px!important}
@media(max-width:380px){
  .partBox{grid-template-columns:minmax(0,1fr) 38px 30px 38px!important;gap:5px!important;padding:6px 8px!important}
  .partBox .partMinus,.partBox .partPlus{width:38px!important;min-width:38px!important;height:38px!important;min-height:38px!important}
  .partBox .partQty{width:30px!important;min-width:30px!important}
}
</style>
</head>
<body>
<h2>MHAC DELIVERY CUSTOMER APP</h2>
<p>Customer V4.1.57 — Chicken Part Selection alignment patch.</p>
<div class="partGrid">
  <div class="partBox"><span class="partName">Chicken Leg</span><button class="partMinus">−</button><b class="partQty">0</b><button class="partPlus">+</button></div>
  <div class="partBox"><span class="partName">Chicken Thigh</span><button class="partMinus">−</button><b class="partQty">0</b><button class="partPlus">+</button></div>
  <div class="partBox"><span class="partName">Chicken Wings</span><button class="partMinus">−</button><b class="partQty">0</b><button class="partPlus">+</button></div>
</div>
<div class="partTotal">Selected pieces: <b>0</b> / <b>1</b></div>
</body>
</html>
