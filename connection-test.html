<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC Connection Test</title>
<style>body{font-family:Arial;background:#f5f5f5;padding:18px}.card{max-width:650px;margin:auto;background:#fff;border:2px solid #ddd;border-radius:18px;padding:18px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:900}.ok{color:#138a36;font-weight:900}.bad{color:#c00;font-weight:900}pre{white-space:pre-wrap;background:#eee;padding:10px;border-radius:10px}</style></head>
<body><div class="card"><h1>🔌 MHAC CONNECTION TEST</h1><p>Tests Firebase Authentication + Realtime Database.</p><button onclick="go()">TEST CONNECTION</button><p id="s">Not tested.</p><pre id="r"></pre></div>
<script src="mhac-firebase-config.js"></script><script src="mhac-connection.js"></script><script>
async function go(){const s=document.getElementById("s"),r=document.getElementById("r");s.textContent="Testing…";r.textContent="";try{const x=await MHACShared.testConnection();s.textContent="✅ CONNECTION OK";s.className="ok";r.textContent=JSON.stringify(x,null,2)}catch(e){s.textContent="❌ CONNECTION FAILED";s.className="bad";r.textContent=e.message}}
</script></body></html>
