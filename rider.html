<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY — RIDER APP</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}header{background:#111;color:#fff;text-align:center;padding:22px 14px;border-bottom:5px solid #e21d25}header h1{margin:0;font-size:26px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border:2px solid #ddd;border-radius:18px;padding:18px;margin:12px 0}input{width:100%;padding:13px;margin:6px 0;border:2px solid #ccc;border-radius:12px;font-size:16px}button{border:0;border-radius:12px;padding:13px 16px;background:#111;color:#fff;font-weight:900;font-size:15px}button.green{background:#138a36}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.status{color:#666;font-size:13px}.pill{padding:6px 9px;border-radius:20px;background:#eee;font-weight:900}.hidden{display:none}.nav{display:block;text-align:center;text-decoration:none;margin-top:8px;background:#e21d25;color:#fff;border-radius:12px;padding:13px;font-weight:900}</style></head>
<body><header><h1>MHAC DELIVERY — RIDER APP</h1><p>ORDER • CUSTOMER LOCATION • NAVIGATION</p></header><main>
<div id="login" class="card"><h2>🔐 RIDER LOGIN</h2><input id="id" placeholder="Rider ID"><input id="pw" type="password" placeholder="Password"><button style="width:100%" onclick="login()">🔐 LOGIN</button><p class="status">RIDER01 is the active rider account.</p></div>
<div id="app" class="hidden"><div class="card"><div class="row"><h2 style="flex:1">🏍️ RIDER01</h2><button onclick="logout()">LOG OUT</button></div><p id="conn" class="status">Connecting…</p></div><div id="orders"></div></div>
</main><script src="mhac-firebase-config.js"></script><script src="mhac-connection.js"></script><script>
const RIDER="RIDER01",PASS="mhacrider";let stop=null;
function login(){if(document.getElementById("id").value.trim().toUpperCase()!==RIDER||document.getElementById("pw").value!==PASS){alert("Invalid Rider ID or password.");return}sessionStorage.setItem("mhac_rider","1");show()}
function logout(){sessionStorage.removeItem("mhac_rider");if(stop)stop();document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),peso=n=>"₱"+Number(n||0).toFixed(2);
function maps(o){const g=o.customer?.gps;const d=g&&isFinite(Number(g.lat))&&isFinite(Number(g.lon))?g.lat+","+g.lon:[o.customer?.address,o.customer?.barangay,o.customer?.municipality,"Tarlac","Philippines"].filter(Boolean).join(", ");return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(d)+"&travelmode=driving"}
function render(a){const el=document.getElementById("orders");const x=a.filter(o=>String(o.assignedRider||"").toUpperCase()===RIDER&&o.status!=="COMPLETED");el.innerHTML=x.length?x.map(o=>`<div class="card"><div class="row"><b>${esc(o.id)}</b><span class="pill">${esc(o.status)}</span></div><h2>${esc(o.customer?.name)}</h2><p>📞 ${esc(o.customer?.contact||o.customer?.phone||"")}</p><p>📍 ${esc(o.customer?.address||"")}<br>${esc(o.customer?.barangay||"")}, ${esc(o.customer?.municipality||"")}</p><p>${(o.items||[]).map(i=>`<b>${esc(i.store||i.storeName||"STORE")}</b> — ${esc(i.name||i.food)} ×${i.qty||1}${i.choice?" • "+esc(i.choice):""}`).join("<br>")}</p><p><b>Delivery Fee: ${peso(o.fees?.deliveryFee??o.deliveryFee)}</b><br><b>Collect: ${peso(o.fees?.total??o.total)}</b></p><a class="nav" target="_blank" rel="noopener" href="${maps(o)}">🧭 NAVIGATE TO CUSTOMER</a><div class="row" style="margin-top:8px"><button onclick="status('${esc(o.id)}','PICKED UP')">📦 PICKED UP</button><button onclick="status('${esc(o.id)}','ON THE WAY')">🏍️ ON THE WAY</button><button class="green" onclick="status('${esc(o.id)}','COMPLETED')">✅ DELIVERED</button></div></div>`).join(""):"<div class='card'><h3>No assigned rider orders.</h3><p class='status'>Wait for Admin to assign an order to RIDER01.</p></div>"}
async function status(id,s){try{await MHACShared.updateOrder(id,{status:s,updatedAt:new Date().toISOString()})}catch(e){alert(e.message)}}
function show(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");stop=MHACShared.watchOrders((a,e)=>{document.getElementById("conn").textContent=e?"❌ "+e.message:"🟢 LIVE — assigned orders update automatically";if(!e)render(a)})}
if(sessionStorage.getItem("mhac_rider")==="1")show();
</script></body></html>
