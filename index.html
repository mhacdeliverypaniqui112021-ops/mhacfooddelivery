<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#111;background:#fff}header{text-align:center;padding:26px 10px;border-bottom:4px solid #e21d25}.logo{font-size:34px;font-weight:900}.logo b{color:#e21d25}.tag{font-size:18px}.rate{margin:25px 22px;padding:22px;border:3px solid #222;border-radius:24px;text-align:center}.rate h2{color:#c9232a}.rate p{font-size:18px;font-weight:700}.wrap{padding:0 22px 40px}.title{font-size:30px;font-weight:900;margin:28px 0 18px}.stores{display:grid;grid-template-columns:1fr 1fr;gap:14px}.store{padding:24px 8px;border:3px solid #222;border-radius:20px;background:white;font-size:19px;font-weight:900}.cart{margin-top:28px;padding:20px;border:3px solid #222;border-radius:20px}.row{padding:14px 0;border-bottom:1px solid #ddd}.qty{display:flex;gap:10px;align-items:center;margin-top:8px}.qty button,.choice button{padding:8px 13px;border:2px solid #222;border-radius:9px;background:#fff;font-weight:700}.choice{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.modal{display:none;position:fixed;inset:0;background:#0008;padding:18px;overflow:auto}.panel{background:#fff;border-radius:20px;padding:20px;max-width:600px;margin:auto}.close,.add{background:#e21d25;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:900}.close{float:right}.food{border:2px solid #ddd;border-radius:15px;padding:14px;margin:12px 0}.back{padding:8px;border-radius:9px;border:2px solid #222;background:white}
</style></head><body>
<header><div class="logo">MHAC <b>DELIVERY</b></div><div class="tag">FAST • SAFE • ON TIME</div></header>
<div class="rate"><h2>DELIVERY RATE</h2><p>1 KM = ₱40 • SUCCEEDING KM +₱10</p><p>10% SERVICE FEE • MAXIMUM 2 STORES • 2ND STORE +₱5</p></div>
<div class="wrap"><div class="title">CHOOSE STORE</div><div id="stores" class="stores"></div><div class="cart"><h2>🛒 YOUR CART <span id="count" style="float:right">0</span></h2><div id="cart">No items yet.</div></div></div>
<div id="modal" class="modal"><div class="panel"><button class="close" onclick="closeM()">CLOSE</button><div id="body"></div></div></div>
<script>
const D={stores:[
{name:"Jollibee",icon:"🍗",cats:[{name:"Chicken",foods:[{name:"Chickenjoy 1pc",price:99,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45],["Sprite Regular",25],["Sprite Medium",35],["Sprite Large",45]]},{name:"Chickenjoy 2pc",price:159,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]},{name:"Meals",foods:[{name:"Chickenjoy with Rice",price:129,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]}]},
{name:"McDo",icon:"🍟",cats:[{name:"Chicken",foods:[{name:"1pc Chicken McDo",price:99,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]},{name:"Burgers",foods:[{name:"McChicken",price:89,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]}]},
{name:"Mang Inasal",icon:"🍗",cats:[{name:"Chicken",foods:[{name:"PM1 Chicken",price:109,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]},{name:"PM2 Chicken",price:139,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]}]},
{name:"KFC",icon:"🍗",cats:[{name:"Chicken",foods:[{name:"1pc Chicken Meal",price:109,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]}]}]};
let data=JSON.parse(localStorage.mhacMenuV13||"null")||D,cart=[];
function stores(){storesEl.innerHTML=data.stores.map((s,i)=>`<button class=store onclick="store(${i})">${s.icon} ${s.name}</button>`).join("")}
const storesEl=document.getElementById("stores");
function store(i){let s=data.stores[i];body.innerHTML=`<button class=back onclick="store(${i})">← Categories</button><h2>${s.icon} ${s.name}</h2>`+s.cats.map((c,j)=>`<div class=food onclick="cat(${i},${j})"><b>🍽️ ${c.name}</b><br><small>${c.foods.length} choices</small></div>`).join("");modal.style.display="block"}
function cat(si,ci){let c=data.stores[si].cats[ci];body.innerHTML=`<button class=back onclick="store(${si})">← Back</button><h2>${c.name}</h2>`+c.foods.map((f,fi)=>`<div class=food><h3>${f.name}</h3><b>₱${f.price}</b>${f.choices.map((x,xi)=>`<div class=choice><span>${x[0]} <b>+₱${x[1]}</b></span><button onclick="add(${si},${ci},${fi},${xi})">SELECT & ADD</button></div>`).join("")}</div>`).join("")}
function add(si,ci,fi,xi){let f=data.stores[si].cats[ci].foods[fi],x=f.choices[xi],key=si+"-"+ci+"-"+fi+"-"+xi,q=cart.find(a=>a.key==key);q?q.qty++:cart.push({key,name:f.name,store:data.stores[si].name,choice:x[0],price:f.price+x[1],qty:1});render();closeM()}
function render(){count.textContent=cart.reduce((a,x)=>a+x.qty,0);if(!cart.length){cartEl.textContent="No items yet.";return}let sub=0;cartEl.innerHTML=cart.map((x,i)=>{let v=x.price*x.qty;sub+=v;return `<div class=row><b>${x.name}</b><br><small>${x.store} • ${x.choice}</small><div class=qty><button onclick="chg(${i},-1)">−</button><b>${x.qty}</b><button onclick="chg(${i},1)">+</button><span>₱${v}</span></div></div>`}).join("")+`<p><b>Food Order: ₱${sub}</b></p><p>10% Service Fee: ₱${(sub*.1).toFixed(2)}</p><p>Delivery Fee: ₱40</p><h2>GRAND TOTAL: ₱${(sub*1.1+40).toFixed(2)}</h2>`}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);render()}function closeM(){modal.style.display="none"}const modal=document.getElementById("modal"),body=document.getElementById("body"),cartEl=document.getElementById("cart"),count=document.getElementById("count");stores();render();
</script></body></html>
