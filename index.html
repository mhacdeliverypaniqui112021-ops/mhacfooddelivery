<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#111;background:#fff}header{text-align:center;padding:26px 10px;border-bottom:4px solid #e21d25}.logo{font-size:34px;font-weight:900}.logo b{color:#e21d25}.tag{font-size:18px}.rate{margin:25px 22px;padding:22px;border:3px solid #222;border-radius:24px;text-align:center}.rate h2{color:#c9232a}.rate p{font-size:18px;font-weight:700}.wrap{padding:0 22px 40px}.title{font-size:30px;font-weight:900;margin:28px 0 18px}.stores{display:grid;grid-template-columns:1fr 1fr;gap:14px}.store{padding:24px 8px;border:3px solid #222;border-radius:20px;background:white;font-size:19px;font-weight:900}.cart{margin-top:28px;padding:20px;border:3px solid #222;border-radius:20px}.row{padding:14px 0;border-bottom:1px solid #ddd}.qty{display:flex;gap:10px;align-items:center;margin-top:8px}.qty button,.choice button{padding:8px 13px;border:2px solid #222;border-radius:9px;background:#fff;font-weight:700}.choice{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.modal{display:none;position:fixed;inset:0;background:#0008;padding:18px;overflow:auto}.panel{background:#fff;border-radius:20px;padding:20px;max-width:600px;margin:auto}.close,.add{background:#e21d25;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:900}.close{float:right}.food{border:2px solid #ddd;border-radius:15px;padding:14px;margin:12px 0}.back{padding:8px;border-radius:9px;border:2px solid #222;background:white}
.checkout{display:none;position:fixed;inset:0;background:#0008;padding:18px;overflow:auto}.checkout-panel{background:#fff;border-radius:20px;padding:20px;max-width:600px;margin:auto}.checkout-panel input,.checkout-panel textarea,.checkout-panel select{width:100%;padding:12px;margin:7px 0;border:2px solid #ddd;border-radius:10px;font-size:16px}.order-summary{background:#f7f7f7;border-radius:14px;padding:14px;margin:12px 0}.store-head{font-size:19px;color:#e21d25;border-bottom:2px solid #eee;padding-bottom:7px;margin-bottom:8px}.empty{color:#777}
</style></head><body>
<header><div class="logo">MHAC <b>DELIVERY</b></div><div class="tag">FAST • SAFE • ON TIME</div></header>
<div class="rate"><h2>DELIVERY RATE</h2><p>1 KM = ₱40 • SUCCEEDING KM +₱10</p><p>10% SERVICE FEE • MAXIMUM 2 STORES • 2ND STORE +₱5</p></div>
<div class="wrap">
<div class="title">CHOOSE STORE</div>
<div id="stores" class="stores"></div>
<div class="cart">
<h2>🛒 YOUR CART <span id="count" style="float:right">0</span></h2>
<div id="cart">No items yet.</div>
<div id="totals"></div>
<button id="checkoutBtn" class="add" style="width:100%;margin-top:16px;font-size:18px" onclick="openCheckout()">CHECKOUT / PLACE ORDER</button>
</div>
</div>

<div id="checkout" class="checkout">
  <div class="checkout-panel">
    <button class="close" onclick="closeCheckout()">CLOSE</button>
    <h2>CHECKOUT / PLACE ORDER</h2>
    <div id="orderSummary" class="order-summary"></div>
    <h3>Customer Information</h3>
    <input id="custName" placeholder="Customer Name">
    <input id="custContact" placeholder="Contact Number" inputmode="tel">
    <textarea id="custAddress" rows="3" placeholder="Complete Delivery Address"></textarea>
    <select id="payment">
      <option>Cash on Delivery</option>
      <option>GCash</option>
    </select>
    <button class="add" style="width:100%;font-size:18px" onclick="placeOrder()">CONFIRM / PLACE ORDER</button>
  </div>
</div>
<div id="modal" class="modal"><div class="panel"><button class="close" onclick="closeM()">CLOSE</button><div id="body"></div></div></div>
<script>
const D={stores:[
{name:"Jollibee",icon:"🍗",cats:[{name:"Chicken",foods:[{name:"Chickenjoy 1pc",price:99,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45],["Sprite Regular",25],["Sprite Medium",35],["Sprite Large",45]]},{name:"Chickenjoy 2pc",price:159,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]},{name:"Meals",foods:[{name:"Chickenjoy with Rice",price:129,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]}]},
{name:"McDo",icon:"🍟",cats:[{name:"Chicken",foods:[{name:"1pc Chicken McDo",price:99,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]},{name:"Burgers",foods:[{name:"McChicken",price:89,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]}]},
{name:"Mang Inasal",icon:"🍗",cats:[{name:"Chicken",foods:[{name:"PM1 Chicken",price:109,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]},{name:"PM2 Chicken",price:139,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]}]},
{name:"KFC",icon:"🍗",cats:[{name:"Chicken",foods:[{name:"1pc Chicken Meal",price:109,choices:[["No Drink",0],["Coke Regular",25],["Coke Medium",35],["Coke Large",45]]}]}]}]};
let data=JSON.parse(localStorage.mhacMenuV13||"null")||D,cart=[];
function stores(){storesEl.innerHTML=data.stores.map((s,i)=>`<button class=store onclick="store(${i})">${s.icon} ${s.name}</button>`).join("")}
const storesEl=document.getElementById("stores");
function store(i){let s=data.stores[i];body.innerHTML=`<button class=back onclick="store(${i})">← Categories</button><h2>${s.icon} ${s.name}</h2>`+s.cats.map((c,j)=>`<div class=food onclick="cat(${i},${j})"><b>🍽️ ${c.name}</b><br><small>${c.foods.length} choices</small></div>`).join("");modal.style.display="block"}
function cat(si,ci){let c=data.stores[si].cats[ci];body.innerHTML=`<button class=back onclick="store(${si})">← Back</button><h2>${c.name}</h2>`+c.foods.map((f,fi)=>`<div class=food><h3>${f.name}</h3><b>₱${f.price}</b>${f.choices.map((x,xi)=>`<div class=choice><span>${x[0]} <b>+₱${x[1]}</b></span><button onclick="add(${si},${ci},${fi},${xi})">SELECT & ADD</button></div>`).join("")}</div>`).join("")}
function add(si,ci,fi,xi){let f=data.stores[si].cats[ci].foods[fi],x=f.choices[xi],key=si+"-"+ci+"-"+fi+"-"+xi,q=cart.find(a=>a.key==key);q?q.qty++:cart.push({key,name:f.name,store:data.stores[si].name,choice:x[0],price:f.price+x[1],qty:1});render();closeM()}
function render(){
  count.textContent=cart.reduce((a,x)=>a+x.qty,0);
  if(!cart.length){
    cartEl.innerHTML='<div class="empty">No items yet.</div>';
    totals.innerHTML='<p><b>Food Order: ₱0.00</b></p><p>10% Service Fee: ₱0.00</p><p>Delivery Fee: ₱40.00</p><p>2nd Store Fee: ₱0.00</p><h2>GRAND TOTAL: ₱40.00</h2>';
    checkoutBtn.disabled=true; checkoutBtn.style.opacity=.5; return;
  }
  checkoutBtn.disabled=false; checkoutBtn.style.opacity=1;
  let sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
  let storeNames=[...new Set(cart.map(x=>x.store))];
  let grouped={};
  storeNames.forEach(s=>grouped[s]=[]);
  cart.forEach((x,i)=>grouped[x.store].push({...x,i}));
  cartEl.innerHTML=storeNames.map(s=>{
    return '<div class="store-head">'+s.toUpperCase()+'</div>'+
      grouped[s].map(x=>`<div class=row><b>${x.qty} × ${x.name}</b><br><small>${x.choice}</small><div class=qty><button onclick="chg(${x.i},-1)">−</button><b>${x.qty}</b><button onclick="chg(${x.i},1)">+</button><span>₱${(x.price*x.qty).toFixed(2)}</span></div></div>`).join('');
  }).join('');
  let service=sub*.1, delivery=40, second=storeNames.length>1?5:0, total=sub+service+delivery+second;
  totals.innerHTML=`<p><b>Food Order: ₱${sub.toFixed(2)}</b></p>
  <p>10% Service Fee: ₱${service.toFixed(2)}</p>
  <p>Delivery Fee: ₱${delivery.toFixed(2)}</p>
  <p>2nd Store Fee: ₱${second.toFixed(2)}</p>
  <h2>GRAND TOTAL: ₱${total.toFixed(2)}</h2>`;
}
function openCheckout(){
  if(!cart.length) return;
  document.getElementById('checkout').style.display='block';
  buildCheckoutSummary();
}
function closeCheckout(){document.getElementById('checkout').style.display='none'}
function buildCheckoutSummary(){
  let names=[...new Set(cart.map(x=>x.store))];
  let sub=cart.reduce((a,x)=>a+x.price*x.qty,0), second=names.length>1?5:0;
  let total=sub*1.1+40+second;
  document.getElementById('orderSummary').innerHTML=
    names.map(s=>'<div class="store-head">'+s.toUpperCase()+'</div>'+
      cart.filter(x=>x.store===s).map(x=>`<div>${x.qty} × ${x.name} — ${x.choice} — ₱${(x.price*x.qty).toFixed(2)}</div>`).join('')).join('')+
    `<hr><b>Grand Total: ₱${total.toFixed(2)}</b>`;
}
function placeOrder(){
  let name=document.getElementById('custName').value.trim();
  let contact=document.getElementById('custContact').value.trim();
  let address=document.getElementById('custAddress').value.trim();
  if(!name||!contact||!address){alert('Please complete Name, Contact Number and Delivery Address.');return;}
  let order={id:'MHAC-'+Date.now(),customer:{name,contact,address},items:cart.map(x=>({...x})),createdAt:new Date().toISOString(),status:'NEW'};
  let orders=JSON.parse(localStorage.mhacOrders||'[]'); orders.push(order); localStorage.mhacOrders=JSON.stringify(orders);
  alert('ORDER PLACED!\\nOrder No: '+order.id);
  cart=[]; render(); closeCheckout();
}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);render()}function closeM(){modal.style.display="none"}const modal=document.getElementById("modal"),body=document.getElementById("body"),cartEl=document.getElementById("cart"),count=document.getElementById("count"),totals=document.getElementById("totals"),checkoutBtn=document.getElementById("checkoutBtn");stores();render();
</script></body></html>
