<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHAC DELIVERY</title><style>
body{font-family:Arial;margin:0;background:#f5f5f5}header{background:#111;color:#fff;text-align:center;padding:20px;border-bottom:4px solid #e21d25}main{max-width:700px;margin:auto;padding:15px}.card,.food{background:#fff;padding:15px;border-radius:15px;margin:10px 0;border:2px solid #ddd}.stores{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:11px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:800}.store,.red{width:100%}.red{background:#e21d25}.modal{display:none;position:fixed;inset:0;background:#0008;padding:15px;overflow:auto}.panel{background:#fff;border-radius:15px;padding:15px;max-width:600px;margin:auto}input,select{width:100%;padding:11px;margin:5px 0;box-sizing:border-box;border-radius:8px;border:1px solid #aaa}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.ok{color:#138a36;font-weight:900}.total{font-size:20px;font-weight:900}</style></head><body>
<header><h1>MHAC DELIVERY</h1><b>FAST • SAFE • ON TIME</b></header><main>
<div class=card><b>DELIVERY RATE</b><br>1 KM = ₱40 • SUCCEEDING KM +₱10<br><small>10% SERVICE FEE • MAXIMUM 2 STORES • 2ND STORE +₱5</small></div>
<h2>CHOOSE FOOD STORE</h2><div id=stores class=stores></div><div class=card><h2>🛒 CART <span id=count>0</span></h2><div id=cart>No items yet.</div><div id=totals></div><button id=checkout class=red disabled>CHECKOUT / PLACE ORDER</button></div></main>
<div id=modal class=modal><div class=panel><button onclick="modal.style.display='none'">CLOSE</button><div id=menu></div></div></div>
<div id=check class=modal><div class=panel><button onclick="check.style.display='none'">CLOSE</button><h2>CHECKOUT</h2><div id=summary></div><input id=name placeholder="Customer Name"><input id=contact placeholder="Contact Number">
<div class=card><b>📍 GPS DELIVERY LOCATION</b><p id=gpsmsg>GPS not yet allowed.</p><button id=gps class=red>📍 ALLOW GPS LOCATION</button><button id=fee class=red disabled>📍 CALCULATE DELIVERY FEE</button><p id=feemsg></p></div>
<select id=payment><option>Cash on Delivery</option><option>GCash</option></select><button id=send class=red>📤 SEND ORDER</button><p id=sendmsg></p></div></div>
<script type=module>
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getFirestore,collection,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyASKXih0yLfpHqnU8xDYxk1EVi1aZVEc_I",authDomain:"mhac-delivery-53099.firebaseapp.com",projectId:"mhac-delivery-53099",storageBucket:"mhac-delivery-53099.firebasestorage.app",messagingSenderId:"878081137607",appId:"1:878081137607:web:00d3041a1aa0bcbc4f57e2"};
const db=getFirestore(initializeApp(firebaseConfig)),origin={lat:15.66789,lon:120.57765},S=[["Jollibee","🍗",[["Chickenjoy 1pc",99],["Chickenjoy 2pc",159],["Chickenjoy with Rice",129]]],["McDo","🍟",[["1pc Chicken McDo",99],["Burger Solo",89]]],["Mang Inasal","🍗",[["PM1 Chicken",109]]],["KFC","🍗",[["1pc Chicken Meal",109]]]];
let cart=[],gpsData=null,km=null,df=null;const $=x=>document.getElementById(x),peso=n=>"₱"+Number(n||0).toFixed(2);
S.forEach((s,i)=>stores.innerHTML+=`<button class=store onclick="openStore(${i})">${s[1]} ${s[0]}</button>`);
window.openStore=i=>{modal.style.display="block";menu.innerHTML="<h2>"+S[i][1]+" "+S[i][0]+"</h2>"+S[i][2].map((f,j)=>`<div class=food><b>${f[0]}</b> — ${peso(f[1])}<br><button onclick="add(${i},${j})">SELECT & ADD</button></div>`).join("")};
window.add=(si,fi)=>{let sn=S[si][0],used=[...new Set(cart.map(x=>x.store))];if(!used.includes(sn)&&used.length>=2)return alert("Maximum 2 stores per order.");let f=S[si][2][fi],x=cart.find(x=>x.store==sn&&x.name==f[0]);x?x.qty++:cart.push({store:sn,name:f[0],price:f[1],qty:1});render();modal.style.display="none"};
window.change=(i,d)=>{cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);render()};
function render(){count.textContent=cart.reduce((a,x)=>a+x.qty,0);checkout.disabled=!cart.length;cart.innerHTML=cart.map((x,i)=>`<div class=food><b>${x.store}</b><br>${x.name} ×${x.qty}<div class=row><button onclick="change(${i},-1)">−</button><button onclick="change(${i},1)">+</button><b>${peso(x.price*x.qty)}</b></div></div>`).join("")||"No items yet.";let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),sf=sub*.1,sec=[...new Set(cart.map(x=>x.store))].length>1?5:0;totals.innerHTML=`Food: ${peso(sub)}<br>Service: ${peso(sf)}<br>Delivery: ${df==null?"—":peso(df)}<br>2nd Store: ${peso(sec)}<br><span class=total>Total: ${peso(sub+sf+sec+(df||0))}</span>`}
checkout.onclick=()=>{check.style.display="block";summary.innerHTML=cart.map(x=>`${x.store} — ${x.name} ×${x.qty}`).join("<br>")};
function feeFor(k){return 40+Math.max(0,Math.ceil(k)-1)*10}
async function route(lat,lon){let r=await fetch(`https://router.project-osrm.org/route/v1/driving/${origin.lon},${origin.lat};${lon},${lat}?overview=false`),j=await r.json();if(j.code!="Ok")throw Error("Route unavailable");return j.routes[0].distance/1000}
gps.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{gpsData={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};gpsmsg.innerHTML="<span class=ok>✅ GPS LOCATION DETECTED</span><br>Accuracy: "+Math.round(p.coords.accuracy)+"m";fee.disabled=false},()=>gpsmsg.textContent="❌ Allow location permission and retry.",{enableHighAccuracy:true,timeout:20000,maximumAge:0});
fee.onclick=async()=>{fee.disabled=true;feemsg.textContent="📍 Calculating actual driving distance…";try{km=await route(gpsData.lat,gpsData.lon);df=feeFor(km);feemsg.innerHTML=`<span class=ok>✅ ${km.toFixed(2)} km • Delivery Fee ${peso(df)}</span>`;render()}catch(e){feemsg.textContent="❌ Route unavailable. Retry."}fee.disabled=false};
send.onclick=async()=>{if(!name.value.trim()||!contact.value.trim())return alert("Complete name and contact.");if(!gpsData||km==null)return alert("Allow GPS and calculate delivery fee first.");let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),sf=sub*.1,sec=[...new Set(cart.map(x=>x.store))].length>1?5:0,id="MHAC-"+Date.now();send.disabled=true;sendmsg.textContent="Sending to Firebase…";try{await setDoc(doc(collection(db,"orders"),id),{id,customer:{name:name.value.trim(),contact:contact.value.trim(),address:"GPS LOCATION",gps:gpsData},items:cart,fees:{foodOrder:sub,serviceFee:sf,deliveryFee:df,distanceKm:km,secondStoreFee:sec,total:sub+sf+df+sec},payment:payment.value,status:"NEW",assignedRiderUid:"",createdAt:serverTimestamp()});sendmsg.innerHTML="<span class=ok>✅ ORDER SENT TO ADMIN</span>";cart=[];km=df=null;render()}catch(e){sendmsg.textContent="❌ "+e.message;send.disabled=false}};
render();
</script></body></html>
